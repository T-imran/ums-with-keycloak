spring:
  application:
    name: ums
  jackson:
    serialization:
      write-dates-as-timestamps: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/ums}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8080/realms/ums/protocol/openid-connect/certs}

  datasource:
    url: jdbc:postgresql://localhost:5432/ums
    username: postgres
    password: imran1234
    driver-class-name: org.postgresql.Driver

    jpa:
      hibernate:
        ddl-auto: update
      show-sql: true
      properties:
        hibernate:
          format_sql: true
          dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8081
  servlet:
    context-path: /ums
  error:
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  security:
    resource-client-id: ${KEYCLOAK_RESOURCE_CLIENT_ID:ums-api}
  keycloak:
    auth:
      realm: ${KEYCLOAK_AUTH_REALM:ums}
      client-id: ${KEYCLOAK_AUTH_CLIENT_ID:ums-frontend}
      client-secret: ${KEYCLOAK_AUTH_CLIENT_SECRET:change-me}
    admin:
      server-url: ${KEYCLOAK_SERVER_URL:http://localhost:8080}
      admin-realm: ${KEYCLOAK_ADMIN_REALM:master}
      managed-realm: ${KEYCLOAK_MANAGED_REALM:ums}
      client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:admin-cli}
      client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET:change-me}

logging:
  level:
    org.springframework.security: INFO
    com.erainfotech.ums: INFO
