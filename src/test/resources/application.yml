spring:
  datasource:
    url: jdbc:h2:mem:iam-admin-service;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/bank-asia
          jwk-set-uri: http://localhost:8080/realms/bank-asia/protocol/openid-connect/certs

app:
  security:
    role-source-clients:
      - ums-ui
      - lms-ui
  keycloak:
    auth:
      server-url: http://localhost:8080
      realm: bank-asia
      clients:
        ums-ui:
          client-id: ums-ui
        lms-ui:
          client-id: lms-ui
    admin:
      server-url: http://localhost:8080
      realm: bank-asia
      admin-realm: master
      client-id: iam-admin-service
      client-secret: test-secret
