spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/bank-asia
          jwk-set-uri: http://localhost:8080/realms/bank-asia/protocol/openid-connect/certs

app:
  security:
    role-source-clients:
      - ums-ui
      - lms-ui
  keycloak:
    auth:
      server-url: http://localhost:8080
      realm: bank-asia
      clients:
        ums-ui:
          client-id: ums-ui
        lms-ui:
          client-id: lms-ui
    admin:
      server-url: http://localhost:8080
      realm: bank-asia
      admin-realm: master
      client-id: iam-admin-service
      client-secret: test-secret
